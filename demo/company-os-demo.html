n:{en:`Help`,ar:`مساعدة`},mailAskTag:{en:`ask`,ar:`طلب`},mailOptionsAria:{en:`Answer with one of these`,ar:`أجب بأحد هذه`},mailReplyPlaceholder:{en:`Write your answer…`,ar:`اكتب ردك…`},mailSend:{en:`Send`,ar:`أرسل`},mailReadMore:{en:`Read more`,ar:`اقرأ المزيد`},mailMailTag:{en:`deliverable`,ar:`تسليم`},mailAwaiting:{en:`awaiting {name}`,ar:`بانتظار {name}`},mailYouSaid:{en:`You replied:`,ar:`رددتَ:`},commsSearch:{en:`Search teammates…`,ar:`ابحث عن الزملاء…`},commsNoMatch:{en:`No teammate matches.`,ar:`لا يوجد زميل مطابق.`},clockWork:{en:`Work hours`,ar:`ساعات العمل`},clockRest:{en:`Rest hours`,ar:`ساعات الراحة`},landSeeDemo:{en:`See it in the demo`,ar:`شاهده في العرض التجريبي`},mailLockNote:{en:`The thread answers next — this letter closes when your employee replies.`,ar:`المحادثة تجيب تاليًا — تُغلق هذه الرسالة عندما يرد موظفك.`},teamErrSecondRoot:{en:`One root only — this company already has its top manager. Choose who this person reports to.`,ar:`جذر واحد فقط — لدى الشركة مديرها الأعلى بالفعل. اختر لمن يُقدّم هذا الشخص تقاريره.`},teamErrCycle:{en:`That would close a loop — nobody can report into their own team.`,ar:`هذا يغلق حلقة — لا يمكن أن يُقدّم أحد تقاريره لفريقه الخاص.`},landWhatTitle:{en:`What is company.ai?`,ar:`ما هو company.ai؟`},landWhatBody:{en:`A company that runs in your browser, staffed by humans and AI employees together. You found it in a few questions, you hire the team, and the work moves on its own: tasks advance through their stages, your people talk in threads, and anything that needs your decision arrives in your inbox as a letter.`,ar:`شركة تعمل داخل متصفحك، فريقها من البشر وموظفي الذكاء الاصطناعي معًا. تؤسسها في أسئلة قليلة، وتوظّف الفريق، فيتحرك العمل بنفسه: المهام تتقدم عبر مراحلها، وفريقك يتحدث في محادثات، وكل ما يحتاج قرارك يصل إلى صندوقك رسالة.`},landTeamTitle:{en:`One team, two kinds of people`,ar:`فريق واحد، نوعان من الناس`},landTeamBody:{en:`Every employee has a role, a focus, and a portrait. Give any of them a model — OpenAI, Anthropic, Google, or your own endpoint — and they really work: they report progress in one structured form, and when they need you they send a letter with options to choose from.`,ar:`لكل موظف دورٌ وتركيزٌ، وصورة. اربط أيًا منهم بنموذج — OpenAI أو Anthropic أو Google أو نقطتك الخاصة — فسيعمل حقًا: يُبلغ عن تقدّمه في صيغة موحّدة، وإذا احتاجك أرسل رسالة بخيارات تختار منها.`},landWorkTitle:{en:`The work moves by itself`,ar:`العمل يتحرك بنفسه`},landWorkBody:{en:`An engine ticks on the schedule you set, or by hand when you want it. Every tick your wired people work and report; the board, the threads and the network all update from what really happened. Without any keys, an honest simulated heartbeat keeps the studio alive.`,ar:`محرك ينبض وفق الجدول الذي تضبطه، أو يدويًا متى شئت. في كل نبضة يعمل المرتبطون ويُبلغون؛ واللوحة والمحادثات والشبكة تتحدّث مما حدث فعلًا. وبدون مفاتيح، يبقى الاستوديو حيًّا بنبض محاكى صادق.`},landMailTitle:{en:`Your inbox is a mailbox`,ar:`صندوقك بريد حقيقي`},landMailBody:{en:`Decisions to approve, and letters from your team — compact lines with a sender and a time. Open one, answer with its options or with your own words; the answer walks back into the thread it came from.`,ar:`قرارات للموافقة، ورسائل من فريقك — أسطر مختصرة بمرسل ووقت. افتح رسالة، وأجب بخياراتها أو بكلماتك؛ والرد يعود إلى المحادثة التي جاء منها.`},landViewsTitle:{en:`Seven rooms, one company`,ar:`سبع غرف، شركة واحدة`},landViewTeam:{en:`Team — your people, their roles and their models.`,ar:`الفريق — ناسك، أدوارهم ونماذجهم.`},landViewTasks:{en:`Tasks — the board, four stages, one truth.`,ar:`المهام — اللوحة، أربع مراحل، حقيقة واحدة.`},landViewInbox:{en:`Inbox — letters, decisions and asks.`,ar:`الصندوق — رسائل وقرارات وطلبات.`},landViewComms:{en:`Comms — threads with every teammate.`,ar:`المراسلات — محادثات مع كل زميل.`},landViewNetwork:{en:`Network — the living graph of the work.`,ar:`الشبكة — الرسم الحيّ للعمل.`},landViewWorld:{en:`World — the office floor, alive.`,ar:`العالم — طابق المكتب، حيًّا.`},landViewSet:{en:`Settings — models, schedule, theme and your save.`,ar:`الإعدادات — النماذج والجدول والمظهر وحفظك.`},landDataTitle:{en:`It is yours alone`,ar:`هي لك وحدك`},landDataBody:{en:`No account, no server, no subscription. The whole company lives in your browser as one save file you can export and import anywhere. Free, and the source is open to read.`,ar:`لا حساب، ولا خادم، ولا اشتراك. الشركة كلها تعيش في متصفحك ملف حفظ واحدًا تصدّره وتستورده في أي مكان. مجانية، والمصدر مفتوح للقراءة.`},landNavProduct:{en:`Product`,ar:`المنتج`},landNavHow:{en:`How it works`,ar:`كيف يعمل`},landNavInside:{en:`Inside`,ar:`من الداخل`},landNavFaq:{en:`FAQ`,ar:`أسئلة شائعة`},landNavCta:{en:`Open your studio`,ar:`افتح استوديوهك`},landHeroTitle:{en:`Hire AI employees. Run a real company.`,ar:`وظّف موظفين بالذكاء الاصطناعي. وأدِر شركة حقيقية.`},landHeroBody:{en:`company.ai turns the models you already use — OpenAI, Anthropic, Gemini, or your own — into teammates with roles, tasks, threads and a mailbox. They work the day on a schedule you set, talk to each other, and send you letters when only you can decide. You stay the owner.`,ar:`company.ai يحوّل النماذج التي تستخدمها بالفعل — OpenAI وAnthropic وGemini أو نموذجك الخاص — إلى زملاء لهم أدوار ومهام ومحادثات وصندوق بريد. يعملون طوال اليوم وفق جدولك، ويتحدثون بينهم، ويرسلون لك الرسائل عندما لا يقرر إلا أنت. وتبقى أنت المالك.`},landTrust1:{en:`Runs entirely in your browser`,ar:`يعمل بالكامل داخل متصفحك`},landTrust2:{en:`Your keys, your data — no server between`,ar:`مفاتيحك وبياناتك — بلا خادم وسيط`},landTrust3:{en:`Free and open — no sign-up`,ar:`مجاني ومفتوح — بلا تسجيل`},landFactDoors:{en:`model doors — OpenAI, Anthropic, Gemini, custom`,ar:`أبواب للنماذج — OpenAI وAnthropic وGemini وخصوصي`},landFactRooms:{en:`rooms in the studio — tasks, mail, chat, map`,ar:`غرف في الاستوديو — مهام وبريد ودردشة وخريطة`},landFactTools:{en:`standard tools every model gets`,ar:`أدوات قياسية لكل نموذج`},landFactServers:{en:`servers between you and your data`,ar:`خوادم بينك وبين بياناتك`},landGridTitle:{en:`Everything a company runs on`,ar:`كل ما تقوم عليه الشركة`},landFeatModelsT:{en:`Any model, one company`,ar:`أي نموذج، شركة واحدة`},landFeatModelsB:{en:`Give each employee their own connection — OpenAI, Anthropic, Gemini, or any OpenAI-compatible endpoint. One Test button proves every key, in the provider’s own words.`,ar:`اربط كل موظف باتصاله الخاص — OpenAI أو Anthropic أو Gemini أو أي نقطة متوافقة مع OpenAI. زر اختبار واحد يثبت كل مفتاح بكلام المزوّد نفسه.`},landFeatToolsT:{en:`Models with hands`,ar:`نماذج لها أيدٍ`},landFeatToolsB:{en:`Every model gets the same standard tools: report progress, message a colleague, write the owner a letter. They act instead of narrating.`,ar:`كل نموذج يحصل على الأدوات القياسية نفسها: الإبلاغ عن التقدّم، ومراسلة زميل، وكتابة رسالة للمالك. يتصرّفون بدل أن يحكوا.`},landFeatTreeT:{en:`A real org chart`,ar:`هيكل تنظيمي حقيقي`},landFeatTreeB:{en:`One root, real reporting lines, no loops. Every employee knows who they report to, and progress travels up the tree to you.`,ar:`جذر واحد، وخطوط إدارية حقيقية، بلا حلقات. كل موظف يعرف لمن يُقدّم تقاريره، والتقدّم يصعد الشجرة إليك.`},landFeatMailT:{en:`Decisions by mail`,ar:`القرارات عبر البريد`},landFeatMailB:{en:`When an employee needs you, it lands in your mailbox as one clear question with options — answer once, and the work resumes.`,ar:`عندما يحتاجك موظف، تصلك رسالة في صندوقك: سؤال واحد واضح مع خيارات — تجيب مرة، فيستأنف العمل.`},landFeatWorldT:{en:`The company you can see`,ar:`شركة تراها بعينيك`},landFeatWorldB:{en:`A pixel office where the team walks and works, and a network map of who talks to whom — live views of what really happened, not decoration.`,ar:`مكتب بكسلي يمشي فيه الفريق ويعمل، وخريطة شبكة لمن يحدّث من — مشاهد حية لما حدث فعلًا، لا زينة.`},landFeatLocalT:{en:`Local-first, private by design`,ar:`محلي أولًا، خاص بالتصميم`},landFeatLocalB:{en:`Saves live on your device, keys travel only to the provider you chose. Close the tab; your company waits for you.`,ar:`الحفظ على جهازك، والمفاتيح تسافر إلى المزوّد الذي اخترته فقط. أغلق النافذة؛ شركتك تنتظرك.`},landStepTitle:{en:`From idea to working company in three moves`,ar:`من الفكرة إلى شركة تعمل في ثلاث خطوات`},landStep1T:{en:`Describe your company`,ar:`صف شركتك`},landStep1B:{en:`A name, what it does, and a few questions you answer once. The wizard writes it all into every employee’s system prompt — your company context, not a generic one.`,ar:`اسم، وما تعمله، وأسئلة تجيبها مرة واحدة. يكتبها المعالج في الموجّه النظامي لكل موظف — سياق شركتك أنت، لا سياق عام.`},landStep2T:{en:`Hire your team`,ar:`وظّف فريقك`},landStep2B:{en:`Add employees with roles, portraits and reporting lines, and give each one a model connection. The Test button proves the key before the first task.`,ar:`أضف موظفين بأدوار وصور وخطوط إدارية، واربط كلًا بنموذج. زر الاختبار يثبت المفتاح قبل أول مهمة.`},landStep3T:{en:`Watch the work move`,ar:`شاهد العمل يتحرك`},landStep3B:{en:`The engine ticks on your schedule: tasks advance, notes post into threads, letters arrive when you must decide. Or tick by hand — you are the boss of time here.`,ar:`المحرك ينبض وفق جدولك: المهام تتقدّم، والملاحظات تنزل في المحادثات، والرسائل تصل عندما يجب أن تقرر. أو انبض يدويًا — فأنت رئيس الوقت هنا.`},landBandToolsT:{en:`The standard tool protocol`,ar:`بروتوكول الأدوات القياسي`},landBandToolsB:{en:`Models don’t just talk here — they call tools, and the studio executes them: progress lands on the task, the message lands in the thread, the letter lands in your mailbox. One registry declares every tool, compiled into each provider’s native format; platforms without tool support get the same contract in JSON.`,ar:`النماذج هنا لا تتكلم فحسب — بل تستدعي أدواتًا والاستوديو ينفّذها: التقدّم ينزل على المهمة، والرسالة في المحادثة، والخطاب في صندوقك. سجل واحد يعرّف كل الأدوات لصيغة كل مزوّد، ومن لا يدعم الأدوات ينال العقد نفسه JSON.`},landBandToolsL1:{en:`update_progress — honest percentages on the board`,ar:`update_progress — نسب صادقة على اللوحة`},landBandToolsL2:{en:`message_employee — teammates coordinate for real`,ar:`message_employee — الزملاء يتنسّقون حقًا`},landBandToolsL3:{en:`ask_owner — decisions come to you as letters`,ar:`ask_owner — القرارات تأتيك رسائل`},landBandMailT:{en:`Mail for decisions, chat for everything else`,ar:`البريد للقرارات، والدردشة لما عداها`},landBandMailB:{en:`The inbox is a mailbox, not a notification pile. Every letter is one question with two to five options; approve or reply in one click, and your answer posts back into the employee’s thread so the whole company sees the decision.`,ar:`الصندوق بريد حقيقي لا كومة تنبيهات. كل رسالة سؤال واحد بخيارين إلى خمسة؛ وافق أو رد بنقرة، وردّك ينزل في محادثة الموظف لتراه الشركة كلها.`},landBandMailL1:{en:`One question, clear options`,ar:`سؤال واحد وخيارات واضحة`},landBandMailL2:{en:`Approve, reject, or answer in your own words`,ar:`وافق أو ارفض أو أجب بكلامك`},landBandMailL3:{en:`Every reply returns to the thread`,ar:`كل رد يعود إلى المحادثة`},landBandWorldT:{en:`A studio you can watch`,ar:`استوديو يمكنك مشاهدته`},landBandWorldB:{en:`The World Map is the company floor in pixels: desks, doors, and your people walking between them while work happens. The Network shows every thread and report line as a living graph. Drag it, zoom it, double-click anyone to see their day.`,ar:`خريطة العالم هي طابق الشركة بالبكسل: مكاتب وأبواب وناسك يمشون بينها بينما العمل يجري. والشبكة ترسم كل محادثة وخط إداري رسمًا حيًا. اسحبها، وكبّرها، وانقر مرتين على أي شخص لترى يومه.`},landBandWorldL1:{en:`Live floor, walks and bubbles`,ar:`طابق حيّ ومشي وفقاعات`},landBandWorldL2:{en:`Infinite grid, smooth zoom`,ar:`شبكة لا تنتهي وتكبير سلس`},landBandWorldL3:{en:`Build mode when you want to reshape it`,ar:`وضع البناء عندما تشاء إعادة تشكيله`},landBandModelsT:{en:`Four doors to any model`,ar:`أربعة أبواب إلى أي نموذج`},landBandModelsB:{en:`OpenAI, Anthropic and Gemini each have their own door, and anything OpenAI-compatible — including a server on your own machine — walks through the custom one. Every employee carries their own connection, so a cheap model can run the interns while the flagship runs your lead.`,ar:`OpenAI وAnthropic وGemini لكل منها بابه، وكل ما يتوافق مع OpenAI — حتى خادم على جهازك — يدخل من الباب الخصوصي. وكل موظف يحمل اتصاله، فنموذج رخيص يشغّل المتدربين بينما الرائد يشغّل قادك.`},landBandModelsL1:{en:`OpenAI · Anthropic · Gemini · custom`,ar:`OpenAI · Anthropic · Gemini · خصوصي`},landBandModelsL2:{en:`Per-employee connections and keys`,ar:`اتصالات ومفاتيح لكل موظف`},landBandModelsL3:{en:`The Test button tells the provider’s truth`,ar:`زر الاختبار ينقل حقيقة المزوّد`},landPrivT:{en:`No server ever sees your company`,ar:`لا خادم يرى شركتك أبدًا`},landPrivB:{en:`company.ai runs entirely in your browser. Your saves live in this device’s storage, exportable as one file. Your API keys are stored in your own save and travel directly to the provider you chose — there is no middle server, because there is no server. The source is open; read every line.`,ar:`company.ai يعمل بالكامل في متصفحك. حفظك في تخزين هذا الجهاز، يُصدّر ملفًا واحدًا. ومفاتيحك في حفظك الخاص تسافر مباشرة إلى المزوّد الذي اخترته — لا خادم وسيط، لأنه لا خادم أصلًا. والمصدر مفتوح؛ اقرأ كل سطر.`},landFaqTitle:{en:`Questions, answered plainly`,ar:`أسئلة، إجاباتها صريحة`},landFaq1Q:{en:`Do I need API keys?`,ar:`هل أحتاج مفاتيح API؟`},landFaq1A:{en:`Only for real models. Without any keys the studio runs on an honest simulated heartbeat, and the demo door needs nothing at all.`,ar:`فقط للنماذج الحقيقية. بدون مفاتيح يعمل الاستوديو بنبض محاكى صادق، وباب العرض التجريبي لا يحتاج شيئًا.`},landFaq2Q:{en:`Where does my data live?`,ar:`أين تعيش بياناتي؟`},landFaq2A:{en:`In this browser, on this device — one save you can export and import anywhere. Nothing is uploaded anywhere.`,ar:`في هذا المتصفح، على هذا الجهاز — حفظ واحد تصدّره وتستورده أينما شئت. لا شيء يُرفع أبدًا.`},landFaq3Q:{en:`Which models can I use?`,ar:`أي نماذج يمكنني استخدامها؟`},landFaq3A:{en:`Any. OpenAI, Anthropic and Gemini have doors of their own; anything OpenAI-compatible — including local servers — goes through the custom door.`,ar:`أي نموذج. OpenAI وAnthropic وGemini لها أبوابها، وكل ما يتوافق مع OpenAI — بما فيه الخوادم المحلية — يدخل من الباب الخصوصي.`},landFaq4Q:{en:`Can I run more than one company?`,ar:`هل أستطيع إدارة أكثر من شركة؟`},landFaq4A:{en:`Yes. Every company is its own save on this device; the Start door lists them all and one click switches.`,ar:`نعم. كل شركة حفظها الخاص على الجهاز؛ باب البدء يسردها كلها ونقرة تبدّل.`},landFaq5Q:{en:`Does it work in Arabic?`,ar:`هل يعمل بالعربية؟`},landFaq5A:{en:`Yes — flip the language anytime; the whole interface is bilingual, right to left included.`,ar:`نعم — بدّل اللغة في أي وقت؛ الواجهة كلها ثنائية اللغة، من اليمين إلى اليسار أيضًا.`},landFaq6Q:{en:`What does it cost?`,ar:`كم يكلف؟`},landFaq6A:{en:`The app is free and open source. You only pay your own model providers, per use — and a cheap model per employee goes a long way.`,ar:`التطبيق مجاني ومفتوح المصدر. تدفع فقط لمزوّدي النماذج حسب الاستخدام — ونموذج رخيص لكل موظف يقطع شوطًا.`},landCtaT:{en:`Your company is one click away.`,ar:`شركتك على بعد نقرة.`},landCtaB:{en:`Found it, hire the team, and watch the work move. No sign-up, no server, no waiting.`,ar:`أسّسها، وظّف الفريق، وشاهد العمل يتحرك. بلا تسجيل، بلا خادم، بلا انتظار.`},landFootNote:{en:`Open source — Ahmed-Sleem/company.ai. Credits and licences inside the app.`,ar:`مفتوح المصدر — Ahmed-Sleem/company.ai. الإسناد والتراخيص داخل التطبيق.`},landCompaniesTitle:{en:`Your companies on this device`,ar:`شركاتك على هذا الجهاز`},landNewCompany:{en:`New company`,ar:`شركة جديدة`},landOpenC:{en:`Open`,ar:`افتح`},landResumeSetup:{en:`An unfinished setup is waiting`,ar:`إعداد غير مكتمل بانتظارك`},landResumeSetupB:{en:`Pick up the wizard where you left it`,ar:`أكمل المعالج من حيث توقفت`},landDemoName:{en:`Demo showroom`,ar:`صالة التجربة`},landDemoRowB:{en:`Always here — it cannot be deleted`,ar:`دائمة هنا — لا يمكن حذفها`},landLoadFile:{en:`Load from file`,ar:`حمّل من ملف`},landDelete:{en:`Delete`,ar:`احذف`},landDeleteSure:{en:`Delete for good?`,ar:`حذف نهائي؟`},landEmpty:{en:`No companies on this device yet — create one, load one, or visit the demo.`,ar:`لا شركات على هذا الجهاز بعد — أنشئ واحدة، حمّل واحدة، أو زر التجربة.`},landImportBad:{en:`That file is not a company.ai save.`,ar:`هذا الملف ليس نسخة company.ai.`},modelLabel:{en:`Model`,ar:`النموذج`},chatFailed:{en:`The model call failed — check the key and the model name in Settings.`,ar:`فشل استدعاء النموذج — تحقّق من المفتاح واسم النموذج في الإعدادات.`},notConnected:{en:`Not connected. This person has no model key yet — add one in Settings and they will really answer. No placeholder replies here.`,ar:`غير متّصل. لا يملك هذا الشخص مفتاح نموذج بعد — أضِف واحدًا في الإعدادات ليجيب حقًا. لا ردودplaceholder هنا.`},typingNow:{en:`thinking…`,ar:`يفكّر…`},notifyTitle:{en:`Notifications`,ar:`الإشعارات`},notifyToggle:{en:`Desktop notifications`,ar:`إشعارات سطح المكتب`},notifyNote:{en:`Replies to your messages, finished tasks, new mail and decisions — the browser shows them while you are elsewhere.`,ar:`ردود رسائلك، المهام المنتهية، البريد الجديد والقرارات — يعرضها المتصفح وأنت في مكان آخر.`},notifyAskT:{en:`Browser permission`,ar:`إذن المتصفح`},notifyAsk:{en:`Ask the browser again`,ar:`اطلب من المتصفح مجددًا`},notifyPermGranted:{en:`Allowed by the browser.`,ar:`مسموح من المتصفح.`},notifyPermDenied:{en:`Blocked by the browser — allow notifications for this site, then ask again.`,ar:`محظور من المتصفح — اسمح بالإشعارات لهذا الموقع ثم اطلب مجددًا.`},notifyPermDefault:{en:`Not asked yet — the button asks the browser, the way Chrome does.`,ar:`لم يُطلب بعد — الزر يسأل المتصفح كما يفعل كروم.`},notifyPermUnsupported:{en:`This browser has no notification API.`,ar:`لا يملك هذا المتصفح واجهة إشعارات.`},notifyReplyT:{en:`{name} replied`,ar:`{name} ردّ`},notifyTaskT:{en:`Task saved on the board`,ar:`حُفظت المهمة في اللوحة`},notifyDoneT:{en:`Task finished: {title}`,ar:`انتهت المهمة: {title}`},notifyMailT:{en:`New mail from your company`,ar:`بريد جديد من شركتك`},decisionNoteLabel:{en:`Note to the person (optional)`,ar:`ملاحظة للشخص (اختياري)`},decisionNotePlaceholder:{en:`The reason travels with the decision — for example: not approved because…`,ar:`السبب يصل مع القرار — مثل: لم يُوافق لأن…`},mailClose:{en:`Close`,ar:`إغلاق`},helpViewsTitle:{en:`The studio`,ar:`الاستوديو`},helpViewsBody:{en:`Team holds your people — humans and AI employees, each with a role, a focus and an optional model. Tasks is the board where work moves through four stages. Inbox is your mailbox: decisions to approve and letters from your team, answered with their options or your own words. Comms are the threads. Network is the living graph of who works with whom. World is the office floor you can walk, drag and zoom. Settings keeps the models, the schedule, the look and your save file.`,ar:`الفريق يضمّ أشخاصك — بشرًا وموظفي ذكاء اصطناعي، لكلّ دورٌ وتركيزٌ ونموذجٌ اختياري. المهام لوحة تتحرك فيها الأعمال عبر أربع مراحل. الصندوق بريدك: قرارات للموافقة ورسائل من فريقك تردّ عليها بخياراتها أو بكلماتك. المراسلات هي المحادثات. الشبكة الرسم الحيّ لمن يعمل مع من. العالم طابق المكتب تتجول فيه وتسحبه وتكبّره. والإعدادات تحفظ النماذج والجدول والمظهر وملف حفظك.`},helpKeysTitle:{en:`Keys & gestures`,ar:`المفاتيح والإيماءات`},helpKSearch:{en:`Open the command palette`,ar:`افتح لوحة الأوامر`},helpKMove:{en:`Move through a list`,ar:`تنقّل في القائمة`},helpKRun:{en:`Run the choice · send the message`,ar:`نفّذ الاختيار · أرسل الرسالة`},helpKEsc:{en:`Close the window`,ar:`أغلق النافذة`},helpKNewline:{en:`New line in the messenger`,ar:`سطر جديد في المراسلات`},helpKDrag:{en:`Drag: move a person · pan the world`,ar:`اسحب: حرّك شخصًا · حرّك العالم`},helpKDbl:{en:`Double-click: inspect a person · zoom the world`,ar:`نقرة مزدوجة: افحص شخصًا · قرّب العالم`},helpKZoom:{en:`Wheel or pinch: zoom the graph and the world`,ar:`العجلة أو القرص: كبّر الشبكة والعالم`},helpModelsTitle:{en:`Models & the engine`,ar:`النماذج والمحرك`},helpModelsBody:{en:`Give any employee a provider and a key — OpenAI, Anthropic, Google, or any OpenAI-compatible endpoint. Keys never leave your browser. The engine ticks on the schedule you set in Settings, or by hand from the same page; each tick a wired person reports progress in one structured form, and may send you an ask with options — you answer it from the Inbox. People without a model keep an honest simulated heartbeat, so the studio is alive with no keys at all.`,ar:`امنح أي موظف مزوّدًا ومفتاحًا — OpenAI أو Anthropic أو Google أو أي نقطة متوافقة مع OpenAI. المفاتيح لا تغادر متصفحك أبدًا. ينبض المحرك وفق الجدول الذي تضبطه في الإعدادات، أو يدويًا من الصفحة نفسها؛ وفي كل نبضة يُبلغ الشخص المرتبط عن تقدّمه في صيغة موحّدة، وقد يرسل لك طلبًا بخيارات — تجيبه من الصندوق. ومن بلا نموذج يستمرّون بنبض محاكى صادق، فيبقى الاستوديو حيًّا بدون مفاتيح.`},helpDataTitle:{en:`Your data`,ar:`بياناتك`},integrationsTitle:{en:`Integrations`,ar:`التكاملات`},integrationsNote:{en:`Doors into the outside world. A server’s home must be on GitHub — you run its code, then point the studio at it; Notion and Drive take your own token. Nothing leaves this save.`,ar:`أبواب إلى العالم الخارجي. موطن أي خادم يجب أن يكون على GitHub — تشغّل أنت الكود ثم توجه الاستوديو إليه؛ وNotion وDrive يأخذان رمزك الخاص. لا شيء يغادر هذا الحفظ.`},ixKind:{en:`Kind`,ar:`النوع`},ixLabel:{en:`Name`,ar:`الاسم`},ixRepo:{en:`GitHub repository — github.com/you/server`,ar:`مستودع GitHub — github.com/you/server`},ixEndpoint:{en:`Endpoint — http(s) where it listens`,ar:`النهاية — http(s) حيث يصغي`},ixSecret:{en:`Token`,ar:`الرمز`},ixAdd:{en:`Add`,ar:`أضف`},ixConnect:{en:`Connect`,ar:`اتصل`},ixRemove:{en:`Remove`,ar:`أزل`},ixGithubOnly:{en:`An integration’s server must live on GitHub — paste a github.com repository address.`,ar:`موطن خادم التكامل يجب أن يكون على GitHub — ألصق عنوان مستودع github.com.`},ixNone:{en:`No integrations yet — the shelf above links the reference servers.`,ar:`لا تكاملات بعد — الرف أعلاه يصلك بالخوادم المرجعية.`},stampSent:{en:`Sent`,ar:`أُرسلت`},stampDelivered:{en:`Delivered`,ar:`وصلت`},stampSeen:{en:`Seen`,ar:`شوهدت`},historyViewTitle:{en:`History`,ar:`السجل`},historyNote:{en:`Every model call for this person — exact inputs, tool calls and outputs, on your device.`,ar:`كل استدعاء نموذج لهذا الشخص — المدخلات واستدعاءات الأدوات والمخرجات كما هي، على جهازك.`},historyNone:{en:`No calls recorded for this person yet.`,ar:`لا استدعاءات مسجلة لهذا الشخص بعد.`},historyChat:{en:`conversation`,ar:`محادثة`},historyCycle:{en:`work cycle`,ar:`دورة عمل`},historySystem:{en:`System prompt`,ar:`موجه النظام`},historyInput:{en:`Inputs, as sent`,ar:`المدخلات كما أُرسلت`},historyTools:{en:`Tool calls the model made`,ar:`استدعاءات الأدوات التي قام بها النموذج`},historyOutput:{en:`The model’s exact words`,ar:`كلمات النموذج كما هي`},historyOpen:{en:`History`,ar:`السجل`},helpBuildTitle:{en:`Building the world`,ar:`بناء العالم`},helpBuildBody:{en:`The World view is for looking: drag pans, the wheel zooms, nothing else moves. Open the Build toggle and the floor becomes editable — grab rooms, props and desks to move them, pull a room’s corner to resize it (everything snaps to the grid), delete what is selected, and undo step by step. Closing Build drops every selection and the floor goes back to being a map.`,ar:`عرض العالم للمشاهدة: السحب يحرك، والعجلة تكبّر، ولا شيء آخر يتحرك. افتح مفتاح البناء فيصبح الطابق قابلًا للتعديل — اسحب الغرف والأثاث والمكاتب، واسحب زاوية الغرفة لتغيير حجمها (كل شيء ينطبق على الشبكة)، واحذف المحدّد، وتراجع خطوة بخطوة. وإغلاق البناء يُسقط كل تحديد ويعيد الطابق خريطة.`},helpMailTitle:{en:`Mail vs chat`,ar:`البريد والدردشة`},helpMailBody:{en:`Two wires, two purposes. Comms is chat — quick talk with a teammate, back and forth, no ceremony. The Inbox is mail — decisions to approve and letters your people send when they need your call or have something to deliver. Open a letter with Read more, answer with its options or your own words; your reply walks back into the thread it came from.`,ar:`سلكان، لغرضين. المراسلات دردشة — حديث سريع مع زميل، ذهابًا وإيابًا. والصندوق بريد — قرارات للموافقة ورسائل من فريقك عندما يحتاجون قرارك أو عندهم ما يسلمونه. افتح الرسالة بـاقرأ المزيد، وأجب بخياراتها أو بكلماتك؛ وردك يعود إلى المحادثة التي جاء منها.`},helpStudiosTitle:{en:`Your companies`,ar:`شركاتك`},helpStudiosBody:{en:`One device can hold many companies. The landing has ONE Start button; it opens a window listing every company saved on this device with the day it was last touched — open any of them, delete one (it asks twice), load a company from a save file, or press New company to found another. The demo showroom is always in the window and carries no delete button at all. An unfinished setup waits in the same window.`,ar:`الجهاز الواحد يسع شركات كثيرة. لصفحة البداية زرٌّ واحد «ابدأ» يفتح نافذة تسرد كل شركة محفوظة على الجهاز مع تاريخ آخر لمسة — افتح أيها، احذف واحدة (بعد تأكيد)، حمّل شركة من ملف حفظ، أو اضغط شركة جديدة لتؤسس غيرها. صالة التجربة دائمة في النافذة ولا تحمل زر حذف أبدًا، وإعداد غير مكتمل ينتظرك في النافذة نفسها.`},helpHistoryTitle:{en:`The diary of each person`,ar:`يوميات كل شخص`},helpHistoryBody:{en:`Every model call for a person — exact inputs, tool calls and outputs — is kept on your device. The History button on the card of a person (and on a chat head) opens their diary in a NEW TAB: a windowed list beside the exact transcript. The demo writes no history.`,ar:`كل استدعاء نموذج لأي شخص — المدخلات الدقيقة واستدعاءات الأدوات والمخرجات — محفوظ على جهازك. زر اليوميات في بطاقة الشخص (أو رأس المحادثة) يفتح يومياته في تاب جديد: قائمة مُنوَفذة بجانب النص الحرفي. شركة التجربة لا تكتب يوميات.`},helpDataBody:{en:`Everything lives in your browser — one save file, no server, no account. Export it from Settings as a single file and import it on any device; the file never carries your model keys or integration tokens — those stay on this device. The demo company is a labelled tour; starting your own never touches it.`,ar:`كل شيء يعيش في متصفحك — ملف حفظ واحد، بلا خادم ولا حساب. صدّره من الإعدادات ملفًا واحدًا واستورده على أي جهاز؛ ولا يحمل الملف مفاتيح النماذج أو رموز التكامل أبدًا — فهي تبقى على هذا الجهاز. الشركة التجريبية جولة معلّمة؛ وبدء شركتك لا يمسّها أبدًا.`},searchTitle:{en:`Search`,ar:`بحث`},notifications:{en:`Notifications`,ar:`الإشعارات`},openNav:{en:`Open navigation`,ar:`افتح التنقل`},closeNav:{en:`Close navigation`,ar:`أغلق التنقل`},statusNote:{en:`All data lives in this browser.`,ar:`كل البيانات محفوظة في هذا المتصفح.`},footPeople:{en:`people`,ar:`أفراد`},footOpen:{en:`open tasks`,ar:`مهام مفتوحة`},footWaiting:{en:`waiting your call`,ar:`بانتظار قرارك`},footSaved:{en:`saved`,ar:`حُفظ`},teamPeople:{en:`People`,ar:`الأفراد`},teamWorking:{en:`Working now`,ar:`يعملون الآن`},teamAttention:{en:`Blocked`,ar:`متعثّرون`},teamOpen:{en:`Open tasks`,ar:`مهام مفتوحة`},teamReports:{en:`Reports to`,ar:`يتبع إلى`},teamNoManager:{en:`Answers to no one`,ar:`لا يتبع أحداً`},teamNow:{en:`Current work`,ar:`العمل الحالي`},teamNoTasks:{en:`No open tasks right now.`,ar:`لا مهام مفتوحة حالياً.`},teamSee:{en:`Open profile`,ar:`افتح الملف`},localOnly:{en:`Local changes only`,ar:`تغييرات محلية فقط`},deckNav:{en:`Decision deck`,ar:`سجل القرارات`},prev:{en:`Previous decision`,ar:`القرار السابق`},next:{en:`Next decision`,ar:`القرار التالي`},historyTitle:{en:`Decision history`,ar:`سجل القرارات`},noHistory:{en:`No decisions yet.`,ar:`لا قرارات بعد.`},histRequest:{en:`Request`,ar:`الطلب`},histBy:{en:`Requested by`,ar:`مقدم الطلب`},histStage:{en:`Stage`,ar:`المرحلة`},histActivity:{en:`Activity`,ar:`النشاط`},chatTeammates:{en:`Teammates`,ar:`زملاء الفريق`},chatPlaceholder:{en:`Write a message…`,ar:`اكتب رسالة…`},chatSend:{en:`Send`,ar:`إرسال`},chatStart:{en:`Start the conversation`,ar:`ابدأ المحادثة`},chatNoThread:{en:`No conversation with this teammate yet.`,ar:`لا محادثة مع هذا
