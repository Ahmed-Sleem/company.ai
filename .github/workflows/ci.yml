# The gate, in the cloud (Phase H). Every push to main and every pull request runs the SAME
# verify the owner runs locally — all eleven steps, including the real Chromium smoke against
# the built app and the npm audit with a real network. A red gate here is the same sentence as
# a red gate at home: do not ship.
name: CI — the gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Unlike Pages, a superseded CI run has nothing to publish — the newest push is the only
# verdict that matters, so an in-flight run for an older commit is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same Node the gate and the browser smoke run on locally (`node -v` → v20).
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Browser for the smoke test
        run: npx playwright install chromium --with-deps
      - name: The gate — all eleven steps
        run: bash scripts/verify.sh
