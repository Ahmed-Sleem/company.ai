# Publish the one-file demo to GitHub Pages, on every push to main.
#
# The demo file (demo/company-os-demo.html) is the whole product — the real GUI, its data and its
# API frozen into one HTML file — and it needs no server, which makes it the one thing that can be
# hosted for nothing, forever, with no cold starts. This workflow makes the root URL of the Pages
# site BE the demo: a link you can send anyone, or open on a phone.
#
# One-time switch in the repository: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that, this runs by itself. The site is then at:
#   https://<owner>.github.io/<repo>/
name: Publish the demo file

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes seconds apart cancelled the newer run once, and the site kept serving the older
# content. Runs queue instead: every deploy finishes and the newest content wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Put the demo at the root, and the designer's prototype beside it
        run: |
          mkdir -p site
          cp demo/company-os-demo.html site/index.html
          # The design prototype — the designer's demo plus the force-directed company graph
          # (design/prototype/graph.js, the "Obsidian-style" view), which the app's Network screen
          # does not have yet. Published read-only so it can be opened from anywhere while that
          # port is done. Never edited: design/prototype/verify.mjs guards it.
          mkdir -p site/prototype
          cp design/prototype/company-os.html site/prototype/index.html
          cp design/prototype/company-os.html site/prototype/company-os.html
          cp design/prototype/graph.css design/prototype/graph.js design/prototype/prototype-changes.css site/prototype/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
