# Publish company.ai to GitHub Pages, on every push to main.
#
# The root URL is the real app (REQ-13: it is client-only now — a static bundle that reads and
# writes the visitor's own save, so any static host is the whole product). Beside it:
#
#   /demo/      the frozen one-file demo (demo/company-os-demo.html) — archived, never deleted
#   /prototype/ the designer's prototype (design/prototype/) — read-only, guarded by verify.mjs
#
# Everything is BUILT here, from the same commit, rather than copied from the repository. A
# committed copy goes stale the moment someone changes the app and forgets to regenerate it, and
# then the live link quietly shows yesterday's build — which is exactly what happened once, and
# why this runs `npm ci && build && build-demo-html.mjs` before publishing instead of trusting a
# file in git.
#
# One-time switch in the repository: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that, this runs by itself. The site is then at:
#   https://<owner>.github.io/<repo>/
name: Publish company.ai

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes seconds apart cancelled the newer run once, and the site kept serving the older
# content. Runs queue instead: every deploy finishes and the newest content wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same Node the gate and the browser smoke run on locally (`node -v` → v20).
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the web app
        run: npm run build -w @company/web
      - name: Freeze the demo (app, data and rules in one file) into /demo/
        run: node scripts/build-demo-html.mjs
      - uses: actions/configure-pages@v6
      - name: Root = the real app; demo and prototype beside it
        run: |
          mkdir -p site
          # The real app at the root. The build is emitted with relative asset paths
          # (vite.config.ts, base: './'), so the same dist works at any path on any host.
          cp -r apps/web/dist/. site/
          # The frozen demo, archived where it always was — kept, not deleted.
          mkdir -p site/demo
          cp demo/company-os-demo.html site/demo/index.html
          # The design prototype — the designer's demo plus the force-directed company graph
          # (design/prototype/graph.js, the "Obsidian-style" view), which the app's Network screen
          # does not have yet. Published read-only so it can be opened from anywhere while that
          # port is done. Never edited: design/prototype/verify.mjs guards it. Open it at
          # /prototype/#network — the graph mounts on the Network view.
          mkdir -p site/prototype
          cp design/prototype/company-os.html site/prototype/index.html
          cp design/prototype/company-os.html site/prototype/company-os.html
          # graph.css/graph.js are the network view; world.css/world.js the world tab, which draws
          # with world-lib.js — the app's own world code, bundled and committed (scripts/build-world-lib.mjs).
          cp design/prototype/graph.css design/prototype/graph.js design/prototype/prototype-changes.css site/prototype/
          cp design/prototype/world.css design/prototype/world.js design/prototype/world-lib.js site/prototype/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
