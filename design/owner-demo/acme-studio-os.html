/* Shared visual system. Components consume semantic tokens; themes only change values. */
:root{color-scheme:dark;--bg:#111514;--side:#141817;--surface:#181d1b;--raised:#1d2320;--hover:#232c27;--line:#303b34;--soft:#252e29;--text:#e1e7e1;--muted:#a0aea4;--dim:#819388;--accent:#accab3;--accent-bg:#253c2d;--on-accent:#14271b;--danger:#efaaa3;--warning:#dfc18b;--blue:#a8c4d6;--shadow:0 24px 80px #0007;--font:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;--sans:Arial,Tahoma,sans-serif;--xs:11px;--sm:12px;--base:13px;--body:14px;--lg:16px;--title:28px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--radius:6px;--control:34px;--touch:48px;--nav:210px;--speed:130ms;--max:1440px;--ring:2px solid var(--accent)}

/* -------------------------------------------------------------------------
   HIGH-PERFORMANCE 2D TOP-DOWN OPEN-WORLD ENVIRONMENT STYLING
   ------------------------------------------------------------------------- */
.world-container {
    position: relative;
    width: 100%;
    height: calc(100vh - 110px);
    min-height: 650px;
    border: 2px solid var(--line);
    background: #0b0f0d;
    overflow: hidden;
    user-select: none;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.6), 3px 3px 0 var(--soft);
}

.world-viewport {
    width: 100%;
    height: 100%;
    cursor: grab;
    overflow: hidden;
    position: relative;
    outline: none;
}
.world-viewport:active {
    cursor: grabbing;
}

.world-canvas {
    position: absolute;
    width: 1920px;
    height: 1200px;
    transform-origin: 0 0;
    will-change: transform;
    background-color: #0e1411;
    image-rendering: pixelated;
}

/* Floor Grid & Authentic Room Carpets */
.world-grid-bg {
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to right, rgba(65,111,78,0.05) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(65,111,78,0.05) 2px, transparent 2px);
    background-size: 16px 16px, 16px 16px, 96px 96px, 96px 96px;
    pointer-events: none;
}

/* Atmospheric Room Zones */
.office-room {
    position: absolute;
    border: 2px solid rgba(255,255,255,0.09);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4), 3px 3px 0 rgba(0,0,0,0.5);
    border-radius: 0;
    pointer-events: none;
}
.room-header {
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.room-tag {
    font-family: var(--pixel);
    font-size: 11px;
    letter-spacing: 0.5px;
    background: var(--raised);
    padding: 3px 8px;
    border: 1px solid var(--line);
    color: var(--accent);
    box-shadow: 2px 2px 0 #000;
}
.room-subtag {
    font-family: var(--font);
    font-size: 9px;
    color: var(--dim);
}

/* Department Specific Floor Textures */
.executive-suite {
    background: radial-gradient(circle at 50% 50%, rgba(45, 32, 24, 0.4), rgba(22, 17, 13, 0.7));
    border-color: #5a3d28;
}
.engineering-lab {
    background: radial-gradient(circle at 50% 50%, rgba(18, 36, 42, 0.45), rgba(10, 20, 24, 0.75));
    border-color: #2b5561;
}
.design-studio {
    background: radial-gradient(circle at 50% 50%, rgba(40, 26, 42, 0.35), rgba(20, 14, 22, 0.7));
    border-color: #553359;
}
.operations-hub {
    background: radial-gradient(circle at 50% 50%, rgba(32, 38, 28, 0.4), rgba(16, 20, 15, 0.7));
    border-color: #3b5238;
}
.boardroom-hub {
    background: radial-gradient(circle at 50% 50%, rgba(35, 30, 25, 0.4), rgba(18, 16, 14, 0.75));
    border-color: #4a4035;
}
.lounge-area {
    background: 
        repeating-conic-gradient(rgba(25, 32, 28, 0.6) 0% 25%, rgba(18, 24, 21, 0.6) 0% 50%) 
        50% / 32px 32px;
    border-color: #384f42;
}

/* Props & Decor Styling */
.world-prop {
    position: absolute;
    cursor: pointer;
    transition: transform 100ms, filter 100ms;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
}
.world-prop:hover {
    transform: scale(1.08);
    filter: drop-shadow(0 0 6px var(--accent));
}

/* Pulsing Server LED Animation */
.server-cluster {
    position: absolute;
    display: flex;
    gap: 8px;
    padding: 6px;
    background: #080d0a;
    border: 1px solid #1a3022;
    box-shadow: 2px 2px 0 #000;
}
.server-led {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #4ade80;
    box-shadow: 0 0 4px #4ade80;
    animation: blink 1.2s infinite alternate;
}
.server-led:nth-child(2) { left: 8px; animation-delay: 0.3s; background: #38bdf8; box-shadow: 0 0 4px #38bdf8; }
.server-led:nth-child(3) { left: 16px; animation-delay: 0.6s; background: #fbbf24; box-shadow: 0 0 4px #fbbf24; }
@keyframes blink {
    0% { opacity: 0.2; }
    100% { opacity: 1; }
}

/* Workstations & Seated Characters */
.world-workstation {
    position: absolute;
    width: 84px;
    height: 84px;
    cursor: pointer;
    outline: none;
    transition: transform 120ms, filter 120ms;
    z-index: 10;
}
.world-workstation:hover {
    transform: translateY(-4px) scale(1.05);
    z-index: 20;
}
.world-workstation.selected {
    z-index: 25;
    filter: drop-shadow(0 0 8px var(--accent));
}
.world-workstation.selected .desk-base {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}
.world-workstation.dimmed {
    opacity: 0.22;
    filter: grayscale(0.8);
}

.desk-base {
    position: absolute;
    bottom: 0;
    left: 4px;
    width: 68px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.desk-chair {
    position: absolute;
    bottom: 2px;
    left: 28px;
    z-index: 2;
}
.desk-screen {
    position: absolute;
    top: 4px;
    left: 26px;
    z-index: 3;
}

.agent-sprite {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 15;
}
.agent-avatar-wrap {
    position: relative;
    border: 2px solid var(--line);
    background: var(--surface);
    box-shadow: 2px 2px 0 #000;
}
.status-dot {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 7px;
    height: 7px;
    border: 1px solid #000;
}
.status-dot.working { background: var(--accent); box-shadow: 0 0 4px var(--accent); }
.status-dot.idle { background: var(--warning); }
.status-dot.paused { background: var(--dim); }
.status-dot.error { background: var(--danger); box-shadow: 0 0 4px var(--danger); }

.agent-nametag {
    background: rgba(10, 14, 12, 0.92);
    border: 1px solid var(--line);
    padding: 2px 6px;
    margin-top: 3px;
    text-align: center;
    white-space: nowrap;
    max-width: 110px;
    box-shadow: 1px 1px 0 #000;
}
.agent-nametag strong {
    display: block;
    font-family: var(--pixel);
    font-size: 10px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
}
.agent-nametag small {
    display: block;
    font-size: 8px;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
}

.task-bubble {
    position: absolute;
    top: -5px;
    right: 12px;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: bold;
    padding: 1px 4px;
    border: 1px solid #000;
    box-shadow: 1px 1px 0 #000;
}

/* Floating Retro HUD Overlays */
.world-hud {
    position: absolute;
    left: 14px;
    right: 14px;
    z-index: 50;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.world-hud > * {
    pointer-events: auto;
}
.top-hud {
    top: 14px;
    background: rgba(18, 24, 21, 0.9);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    padding: 8px 12px;
    box-shadow: 2px 2px 0 var(--soft);
    gap: 12px;
    flex-wrap: wrap;
}
.bottom-hud {
    bottom: 14px;
    background: rgba(18, 24, 21, 0.9);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    padding: 8px 14px;
    box-shadow: 2px 2px 0 var(--soft);
}
.hud-group {
    display: flex;
    align-items: center;
    gap: 8px;
}
.room-jumps {
    display: flex;
    gap: 4px;
    overflow-x: auto;
}
.room-jump-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    font-family: var(--pixel);
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    white-space: nowrap;
}
.room-jump-btn:hover {
    background: var(--hover);
    color: var(--text);
    border-color: var(--accent);
}
.world-input, .world-select {
    font-family: var(--pixel);
    font-size: 11px;
    height: 30px;
    padding: 2px 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
}
.hud-stats {
    display: flex;
    gap: 16px;
}
.hud-stat {
    font-family: var(--pixel);
    font-size: 11px;
}

/* Floating Sidebar Drawer */
.world-sidebar-drawer {
    position: absolute;
    top: 70px;
    right: 14px;
    bottom: 56px;
    width: 320px;
    background: var(--surface);
    border: 2px solid var(--line);
    box-shadow: 4px 4px 0 var(--soft);
    z-index: 60;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: drawerSlide 150ms ease-out;
}
@keyframes drawerSlide {
    from { transform: translateX(30px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.drawer-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--soft);
    background: var(--side);
}
.drawer-body {
    padding: 12px;
    overflow-y: auto;
    flex: 1;
}
.drawer-footer {
    padding: 8px 12px;
    border-top: 1px solid var(--soft);
    background: var(--side);
    display: flex;
    justify-content: space-between;
    gap: 8px;
}
.task-drawer-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
}
.task-drawer-item {
    padding: 6px 8px;
    cursor: pointer;
    transition: background 100ms;
}
.task-drawer-item:hover {
    background: var(--raised);
    border-color: var(--dim);
}

function renderWorldCharacters() {
    const deskSlots = layoutDesks();

    const q = (worldState.searchQuery || '').toLowerCase();
    const filterDept = worldState.filterDept;

    return data.agents.map((agent, i) => {
        const slot = deskSlots[i % deskSlots.length];
        const isMatched = (!q || (tr(agent.name) + ' ' + tr(agent.role) + ' ' + agent.dept + ' ' + agent.skills.join(' ')).toLowerCase().includes(q)) &&
                          (filterDept === 'all' || agent.dept.toLowerCase().includes(filterDept.toLowerCase()));
        
        const isSelected = worldState.selectedItem && worldState.selectedItem.id === agent.id;
        const taskCount = data.tasks.filter(t => t.owner === agent.id && t.stage !== 'done').length;

        return `
        <div class="world-workstation ${isSelected ? 'selected' : ''} ${isMatched ? '' : 'dimmed'}" 
             style="left: ${slot.x}px; top: ${slot.y}px;" 
             data-action="world-select-agent" 
             data-id="${agent.id}"
             tabindex="0"
             role="button"
             aria-label="${esc(tr(agent.name))} (${esc(tr(agent.role))})">
            
            <!-- Workstation Furniture Base -->
            <div class="desk-base">${deskArt(slot)}</div>

            <!-- Agent Pixel Portrait & Tags -->
            <div class="agent-sprite">
                <div class="agent-avatar-wrap">
                    ${avatar(agent.avatar, 'sm')}
                    <span class="status-dot ${agent.status}"></span>
                </div>
                <div class="agent-nametag">
                    <strong>${esc(tr(agent.name))}</strong>
                    <small>${esc(tr(agent.role))}</small>
                </div>
                ${taskCount > 0 ? `<div class="task-bubble" title="${taskCount} tasks pending">${taskCount}</div>` : ''}
            </div>
        </div>
        `;
    }).join('');
}

function initWorldNavigation() {
    const vp = $('#world-viewport');
    if (!vp) return;

    // Smooth dragging with pointer events
    vp.onpointerdown = e => {
        if (e.target.closest('.world-workstation') || e.target.closest('.world-prop') || e.target.closest('button') || e.target.closest('input') || e.target.closest('select')) return;
        worldState.isDragging = true;
        worldState.startX = e.clientX - worldState.x;
        worldState.startY = e.clientY - worldState.y;
        vp.setPointerCapture(e.pointerId);
    };

    vp.onpointermove = e => {
        if (!worldState.isDragging) return;
        worldState.x = e.clientX - worldState.startX;
        worldState.y = e.clientY - worldState.startY;
        updateWorldTransform();
    };

    vp.onpointerup = e => {
        if (worldState.isDragging) {
            worldState.isDragging = false;
            try { vp.releasePointerCapture(e.pointerId); } catch(err){}
        }
    };

    // Smooth zooming centered at cursor
    vp.onwheel = e => {
        e.preventDefault();
        const zoomDelta = e.deltaY > 0 ? -0.08 : 0.08;
        const newZoom = Math.min(Math.max(0.45, worldState.zoom + zoomDelta), 2.2);
        
        const rect = vp.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        worldState.x -= (mouseX - worldState.x) * (newZoom / worldState.zoom - 1);
        worldState.y -= (mouseY - worldState.y) * (newZoom / worldState.zoom - 1);
        worldState.zoom = newZoom;
        updateWorldTransform();
    };

    // Keyboard navigation (WASD & Arrow Keys)
    vp.onkeydown = e => {
        const step = 45;
        let handled = false;
        if (['KeyW', 'ArrowUp'].includes(e.code)) { worldState.y += step; handled = true; }
        if (['KeyS', 'ArrowDown'].includes(e.code)) { worldState.y -= step; handled = true; }
        if (['KeyA', 'ArrowLeft'].includes(e.code)) { worldState.x += step; handled = true; }
        if (['KeyD', 'ArrowRight'].includes(e.code)) { worldState.x -= step; handled = true; }
        if (['Equal', 'NumpadAdd'].includes(e.code)) { worldState.zoom = Math.min(2.2, worldState.zoom + 0.1); handled = true; }
        if (['Minus', 'NumpadSubtract'].includes(e.code)) { worldState.zoom = Math.max(0.45, worldState.zoom - 0.1); handled = true; }
        if (handled) {
            e.preventDefault();
            updateWorldTransform();
        }
    };
}

function updateWorldTransform() {
    const canvas = $('#world-canvas');
    if (canvas) {
        canvas.style.transform = `translate3d(${worldState.x}px, ${worldState.y}px, 0) scale(${worldState.zoom})`;
    }
}

function openDialog(title,body,footer='',eyebrow='',small=false,context=null){hideRailTip();const d=$('#dialog');if(!d.open)lastTrigger=document.activeElement;modalContext=context;d.className=small?'small-dialog':'';d.innerHTML=`<header class="dialog-head"><div>${eyebrow?`<div class="eyebrow">${esc(t(eyebrow))}</div>`:''}<h2 id="dialog-title">${esc(t(title))}</h2></div>${ib('Close','close-dialog','close')}</header><div class="dialog-body">${body}</div>${footer?`<footer class="dialog-foot">${footer}</footer>`:''}`;d.setAttribute('aria-labelledby','dialog-title');if(!d.open)d.showModal();setTimeout(()=>{$('[autofocus]',d)?.focus();},0);}
function closeDialog(){if($('#dialog')?.open){$('#dialog').close();modalContext=null;if(lastTrigger?.isConnected)lastTrigger.focus();}}

if(tab==='conversations')body+=data.threads.filter(x=>x.members.includes(id)).map(th=>`<button class="search-result" data-action="open-thread" data-id="${th.id}">${icon('chat')}<span>${esc(tr(th.name))}</span>${icon('arrow')}</button>`).join('')||`<p class="empty-inline">${t('No messages yet')}</p>`;
openDialog(tr(a.name),body,button('Assign task','new-task',`data-owner="${id}"`)+button('Open conversation','agent-chat',`data-id="${id}"`,'primary','chat'),'Profile',false,{type:'profile',id,tab});}

function taskDialog(id){const task=data.tasks.find(x=>x.id===id);if(!task)return;const body=`<div class="row between wrap"><span class="task-id">${task.id}</span>${badge(task.priority,task.priority)}</div><p class="muted spaced">${esc(tr(task.description))}</p><div class="profile-detail"><label class="field">${t('Stage')}<select id="task-stage" data-id="${id}">${STAGES.map(s=>`<option value="${s}" ${s===task.stage?'selected':''}>${t(s)}</option>`).join('')}</select></label><label class="field">${t('Owner')}<select id="task-owner" data-id="${id}"><option value="you" ${task.owner==='you'?'selected':''}>${esc(data.operator)}</option>${data.agents.map(a=>`<option value="${a.id}" ${a.id===task.owner?'selected':''}>${esc(tr(a.name))}</option>`).join('')}</select></label><label class="field">${t('Due date')}<input id="task-due" data-id="${id}" type="date" value="${task.due}" required></label><label class="field">${t('Progress')}<input id="task-progress" data-id="${id}" type="number" min="0" max="100" value="${task.progress}" required></label></div><h3>${t('Checklist')}</h3><div class="spaced">${task.checks.map((c,i)=>`<label class="check-row"><input type="checkbox" data-check="${i}" data-task="${id}" ${c.done?'checked':''}><span>${esc(tr(c.text))}</span></label>`).join('')}</div><div class="sectionhead spaced"><h3>${t('Files')}</h3>${button('Attach file','task-file',`data-id="${id}"`,'small ghost','attach')}</div>${task.files.map((f,i)=>`<button class="attachment" data-action="task-download" data-id="${id}" data-index="${i}">${icon('file')}<span>${esc(f.name)}</span>${icon('download')}</button>`).join('')}<h3 class="spaced">${t('Comments')} <span class="dim">${num(task.comments.length)}</span></h3><div>${task.comments.map(c=>`<div class="comment"><strong>${esc(c.name)}</strong><p class="muted">${esc(tr(c.text))}</p></div>`).join('')||`<p class="small muted">${t('No comments yet')}</p>`}</div><form id="comment-form" data-id="${id}" class="row spaced"><input name="comment" aria-label="${t('Write a comment…')}" placeholder="${t('Write a comment…')}" required maxlength="1000"><button class="btn" type="submit">${t('Post comment')}</button></form><h3 class="spaced">${t('Activity history')}</h3>${task.activity.slice(-6).reverse().map(e=>`<div class="activity small muted">${icon('clock')}${esc(tr(e))}</div>`).join('')}`;openDialog(tr(task.title),body,button('Close','close-dialog')+button('Edit task','edit-task',`data-id="${id}"`,'primary'),'Task detail',false,{type:'task',id});}
function taskForm(owner='you',id){const task=data.tasks.find(x=>x.id===id);openDialog(task?'Save changes':'New task',`<form id="task-form" class="form-grid"><label class="field full">${t('Title')}<input name="title" required maxlength="120" value="${esc(task?tr(task.title):'')}" autofocus></label><label class="field">${t('Owner')}<select name="owner"><option value="you">${esc(data.operator)}</option>${data.agents.map(a=>`<option value="${a.id}" ${(task?.owner||owner)===a.id?'selected':''}>${esc(tr(a.name))}</option>`).join('')}</select></label><label class="field">${t('Priority')}<select name="priority">${['low','medium','high','critical'].map(p=>`<option value="${p}" ${(task?.priority||'medium')===p?'selected':''}>${t(p)}</option>`).join('')}</select></label><label class="field">${t('Due date')}<input name="due" type="date" required value="${task?.due||'2026-10-07'}"></label><label class="field">${t('Stage')}<select name="stage">${STAGES.map(s=>`<option value="${s}" ${(task?.stage||'backlog')===s?'selected':''}>${t(s)}</option>`).join('')}</select></label><label class="field full">${t('Description')}<textarea name="description" maxlength="2000">${esc(task?tr(task.description):'')}</textarea></label></form>`,button('Cancel','close-dialog')+`<button type="submit" form="task-form" class="btn primary">${t(task?'Save changes':'Add task')}</button>`,'Tasks',false,{type:'task-form',id});}
function threadForm(){openDialog('New conversation',`<form id="thread-form" class="stack"><label class="field">${t('Conversation name')}<input name="name" required maxlength="60" autofocus></label><label class="field">${t('Conversation')}<select name="kind"><option value="group">${t('Group conversation')}</option><option value="dm">${t('Direct message')}</option></select></label><h3>${t('Participants')}</h3><div class="form-grid">${data.agents.map(a=>`<label class="check-row"><input type="checkbox" name="members" value="${a.id}">${avatar(a.avatar,'sm')}<span>${esc(tr(a.name))}</span></label>`).join('')}</div><p id="form-error" role="alert" class="form-error"></p></form>`,button('Cancel','close-dialog')+`<button class="btn primary" form="thread-form" type="submit">${t('Create conversation')}</button>`,'Conversations',false,{type:'thread-form'});}
function departmentForm(){openDialog('Form a department',`<form id="department-form" class="stack"><label class="field">${t('Department name')}<input name="name" required maxlength="50" autofocus></label><label class="field">${t('Department lead')}<select name="lead"><option value="">${t('No lead')}</option>${data.agents.map(a=>`<option value="${a.id}">${esc(tr(a.name))}</option>`).join('')}</select></label><p id="form-error" class="form-error" role="alert"></p></form>`,button('Cancel','close-dialog')+`<button class="btn primary" form="department-form" type="submit">${t('Create department')}</button>`,'Departments',true,{type:'department-form'});}
function askDialog(id){const d=data.decisions.find(x=>x.id===id);if(!d)return;openDialog('Ask a question',`<h3>${esc(tr(d.title))}</h3><p class="small muted spaced">${esc(tr(d.ask))}</p><form id="ask-form" data-id="${id}" class="spaced"><label class="field">${t('What would you like to clarify?')}<textarea name="question" required maxlength="1500" autofocus></textarea></label></form>`,button('Cancel','close-dialog')+`<button type="submit" form="ask-form" class="btn primary">${t('Send question')}</button>`,'Inbox',true,{type:'ask',id});}
function decide(id,verdict,question=''){const d=data.decisions.find(x=>x.id===id);if(!d)return;data.decisions=data.decisions.filter(x=>x.id!==id);data.history.unshift({...d,verdict,question,time:now()});if(verdict==='approve'){const a=agent(d.from);if(a&&a.status==='error'){a.status='working';a.focus=['Preparing the retention report','إعداد تقرير الاحتفاظ'];}}
if(question){const th=ensureDM(d.from);data.messages[th.id].push({id:uid(),from:'you',text:question,time:now(),status:'sent'});}event([`${verdict==='approve'?'Approved':verdict==='reject'?'Rejected':'Question sent'}: ${tr(d.title)}`,`${verdict==='approve'?'تمت الموافقة':verdict==='reject'?'تم الرفض':'تم إرسال السؤال'}: ${Array.isArray(d.title)?d.title[1]:d.title}`],'inbox');closeDialog();render();notify('Decision recorded');}
function ensureDM(id){let th=data.threads.find(x=>x.kind==='dm'&&x.members.length===1&&x.members[0]===id);if(!th){th={id:uid(),name:agent(id).name,kind:'dm',members:[id],model:'GPT-4o'};data.threads.push(th);data.messages[th.id]=[];save();}return th;}

function searchResults(query){const q=query.toLowerCase();const entries=[...NAV.map(n=>({title:t(n[1]),kind:t('Workspace'),action:'search-nav',id:n[0],icon:n[2]})),...data.agents.map(a=>({title:tr(a.name)+' · '+tr(a.role),kind:t('Employee'),action:'profile',id:a.id,icon:'team'})),...data.tasks.map(x=>({title:tr(x.title),kind:x.id,action:'task',id:x.id,icon:'task'})),...data.threads.map(x=>({title:tr(x.name),kind:t('Conversation'),action:'open-thread',id:x.id,icon:'chat'}))].filter(x=>(x.title+' '+x.kind).toLowerCase().includes(q));$('#search-results').innerHTML=entries.map(e=>`<button class="search-result" data-action="${e.action}" data-id="${e.id}">${icon(e.icon)}<span>${esc(e.title)}</span><small>${esc(e.kind)}</small></button>`).join('')||`<p class="empty-inline">${t('No matches')}</p>`;}

function download(filename,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function filePreview(f){const body=f.sample?`# ${t('Release notes')}\n\n${t('This is a local sample file for the appearance demo.')}\n\n- Streaming update ready for review\n- Billing tests in progress\n- Rollback checklist attached to migration task`:f.content||'';if(f.data){const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click();return;}openDialog('File preview',`<p class="small muted">${esc(f.name)}</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px" dir="auto">${esc(body)}</pre>`,button('Close','close-dialog')+button('Download','download-preview','','primary','download'),'Sample document',true,{type:'file',file:f,body});}

function add(d,wx,wy){W.push();const id=uid();let o,k;
 if(d.k==='room'){k='room';o={id,key:id,name:'New Room',sub:'',theme:d.theme,x:0,y:0,w:320,h:240};W.L.rooms.push(o)}
 else if(d.k==='desk'){k='desk';o={id,dept:d.dept,deskType:d.type,x:0,y:0,w:84,h:84};W.L.desks.push(o)}
 else{k='prop';const s=W.M[d.type];o={id,type:d.type,w:s.w*W.GRAIN,h:s.h*W.GRAIN,x:0,y:0,label:s.l};W.L.props.push(o)}
 o.x=Math.max(0,snap(wx-(o.w||84)/2));o.y=Math.max(0,snap(wy-(o.h||84)/2));W.sel={k,id};done()}

 addEventListener('pointermove',mv);addEventListener('pointerup',up)});

function drag(e,vp){const t=e.target;let k,o,el;
 const rz=t.closest('[data-rz]');el=t.closest('[data-bk],.world-workstation');if(!el)return false;
 if(el.classList.contains('world-workstation')){const i=data.agents.findIndex(a=>a.id===el.dataset.id)%W.L.desks.length;o=W.L.desks[i];k='desk'}
 else{k=el.dataset.bk;o=(k==='room'?W.L.rooms:W.L.props).find(x=>x.id===el.dataset.bid)}
 if(!o)return false;e.stopPropagation();e.preventDefault();
 const had=W.sel&&W.sel.id===o.id;W.sel={k,id:o.id};const sx=e.clientX,sy=e.clientY,ox=o.x,oy=o.y,ow=o.w,oh=o.h;let moved=false;
 vp.setPointerCapture(e.pointerId);

  if(rz){o.w=Math.max(96,snap(ow+dx));o.h=Math.max(96,snap(oh+dy));el.style.width=o.w+'px';el.style.height=o.h+'px'}
  else{o.x=Math.max(0,snap(ox+dx));o.y=Math.max(0,snap(oy+dy));el.style.left=o.x+'px';el.style.top=o.y+'px'}};
 const up=()=>{vp.removeEventListener('pointermove',mv);vp.removeEventListener('pointerup',up);try{vp.releasePointerCapture(e.pointerId)}catch(x){}if(moved||!had)done();else{W.save()}};
 vp.addEventListener('pointermove',mv);vp.addEventListener('pointerup',up);return true}

 cam()};
